[project]
name = "project2-arutiunian-m26-555"
version = "0.1.0"
description = "Simple console database project"
authors = [
    { name = "Alexandr Arutiunian" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.16.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primitive_db"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
